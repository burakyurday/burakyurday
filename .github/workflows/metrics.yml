name: GitHub Metrics
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/metrics.yml', 'scripts/public_metrics.py']

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
    steps:
      - name: Check out public metrics renderer
        if: env.METRICS_TOKEN == ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Refresh public repository overview
        if: env.METRICS_TOKEN == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/public_metrics.py
          if ! git diff --quiet -- assets/github-metrics.svg; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add assets/github-metrics.svg
            git commit -m 'chore: refresh public repository overview [skip ci]'
            git push origin HEAD:main
          fi
      - name: Generate GitHub activity and language metrics
        if: env.METRICS_TOKEN != ''
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          user: burakyurday
          filename: assets/github-metrics.svg
          committer_branch: main
          base: activity, repositories
          config_timezone: Europe/Istanbul
          config_display: large
          config_animations: no
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_skipped: burakyurday/burakyurday
          plugin_languages_details: percentage
          plugins_errors_fatal: yes
          output_condition: success
          committer_message: 'chore: refresh GitHub metrics [skip ci]'
